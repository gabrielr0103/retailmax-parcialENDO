# Ficha de procedencia del dataset de entrenamiento.
# Regla: si cambia data/raw/ventas_semanales.csv.dvc, esta ficha cambia en el mismo commit.
dataset: ventas_semanales
descripcion: Unidades vendidas por semana, tienda y categoría en los cinco países
version: "2026.10.1"
archivo_dvc: data/raw/ventas_semanales.csv.dvc
md5: aa36252fb1d43190320f9bb8554bcfd0
filas: 5520
periodo:
  desde: "2025-01-06"
  hasta: "2026-10-05"

origen:
  - sistema: POS de las tiendas físicas
    tabla: ventas.transacciones
  - sistema: Plataforma de e-commerce
    tabla: ventas.transacciones (canal = 'ecommerce')
  - sistema: MDM
    tablas: [maestros.tiendas, maestros.productos]

extraccion:
  consulta: sql/ventas_semanales.sql
  parametros:
    fecha_inicio: "2025-01-06"
    fecha_fin: "2026-10-12"
  ejecutada_por: DAG modelo_ventas_semanal (Airflow)
  fecha: "2026-10-12"

transformaciones:
  - Solo transacciones en estado pagada
  - Agregación a semana que empieza el lunes
  - Precio unitario promedio de la semana, en USD

validacion:
  script: src/validar_datos.py
  reglas: config/prod.yaml (bloque calidad)
  resultado: sin fallas

responsables:
  data_owner: Director comercial
  data_steward: Analista de datos comerciales

clasificacion: Interna. No tiene datos personales, solo agregados por tienda.

historial:
  - version: "2026.10.1"
    fecha: "2026-10-12"
    md5: aa36252fb1d43190320f9bb8554bcfd0
    filas: 5520
    cambio: Se agregan las semanas del 7 de septiembre al 5 de octubre de 2026
  - version: "2026.09.1"
    fecha: "2026-09-07"
    md5: a3bf61df55a25fcee8c33c71f7fde83f
    filas: 5220
    cambio: Primera versión, desde enero de 2025
