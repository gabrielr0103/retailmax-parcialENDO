[project]
name = "retailmax-dataops"
version = "0.1.0"
description = "Pipeline DataOps del modelo de predicción de ventas de RetailMax"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
